@switch (state?.status) {
  @case ('loading') {
    <section style="display:flex; justify-content:center; padding:50px;">
      <mat-progress-spinner
        mode="indeterminate"
        diameter="50"
        aria-label="Caricamento dati"
      ></mat-progress-spinner>
    </section>
  }
  @case ('error') {
    <mat-card aria-live="polite"
      style="background:#ffebee; border-left:4px solid #c62828; padding:1rem; margin:1rem 0;">
      <mat-card-title style="color:#c62828; font-size:1rem;">Errore di caricamento</mat-card-title>
      <mat-card-content>
        <p style="margin:0.5rem 0;">{{ $any(state).message }}</p>
        <button mat-stroked-button color="warn" (click)="onRetry()">Riprova</button>
      </mat-card-content>
    </mat-card>
  }
  @default {
    <ng-content></ng-content>
  }
}
